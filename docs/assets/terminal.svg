<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 1256.0" width="766" height="1256.0" role="img" aria-label="Terminal output of contextlint audit against the bundled fixture workspace"><rect width="766" height="1256.0" fill="#111110" rx="10"/><rect width="766" height="38" fill="#000000" opacity="0.22"/><circle cx="22" cy="19.0" r="5.5" fill="#ff5f57"/><circle cx="41" cy="19.0" r="5.5" fill="#febc2e"/><circle cx="60" cy="19.0" r="5.5" fill="#28c840"/><text x="383.0" y="23.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="11" fill="#8a8880" text-anchor="middle">contextlint — audit</text><text x="22" y="70.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="700" fill="#f2f1ea" xml:space="preserve">contextlint  ~/contextlint/benchmarks/fixtures/bloated</text><text x="22" y="89.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="22" y="108.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">assistants  claude_code, codex, cursor, copilot</text><text x="22" y="127.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">assets      18   tokenizer heuristic (estimate)   0.01s</text><text x="22" y="165.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="700" fill="#f2f1ea" xml:space="preserve">ALWAYS-ON CONTEXT</text><text x="22" y="184.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  ········································      228 tok   0.1% of 200,000</text><text x="22" y="203.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  on-demand (loaded only when invoked): 274 tok</text><text x="22" y="222.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  safe to reclaim       32 tok (14%)  duplicates and empty assets</text><text x="22" y="241.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  worth reviewing       72 tok (32%)  needs your judgement, see findings</text><text x="22" y="279.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="700" fill="#f2f1ea" xml:space="preserve">WHERE IT GOES</text><text x="22" y="298.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  by assistant</text><text x="22" y="317.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    claude_code           161  ▉▉▉▉▉▉▉▉▉▉▉▉▉▉▉▉</text><text x="22" y="336.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    cursor                 24  ▉▉</text><text x="22" y="355.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    codex                  22  ▉▉</text><text x="22" y="374.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    copilot                21  ▉▉</text><text x="22" y="393.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  by kind</text><text x="22" y="412.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    skill                 104  ▉▉▉▉▉▉▉▉▉▉</text><text x="22" y="431.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    memory                 57  ▉▉▉▉▉▉</text><text x="22" y="450.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    instruction            43  ▉▉▉▉</text><text x="22" y="469.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#5c9dee" xml:space="preserve">    rule                   24  ▉▉</text><text x="22" y="507.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="700" fill="#f2f1ea" xml:space="preserve">FINDINGS   CRIT 3  HIGH 6  MED 7  LOW 0  INFO 4</text><text x="22" y="545.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="600" fill="#ff8b8b" xml:space="preserve"> CRIT  Credential passed as a command-line argument to MCP server 'cookie-auth': --secure-psid</text><text x="22" y="564.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       `--secure-psid g.a000…` in</text><text x="22" y="583.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       ~/contextlint/benchmarks/fixtures/bloated/.mcp.json. Arguments</text><text x="22" y="602.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       are worse than environment variables, not better: the config file still gets committed and</text><text x="22" y="621.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       screenshotted, and the value is additionally visible to anyone who can run `ps` on this</text><text x="22" y="640.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       machine. Session cookies are the common case and are as good as a password until they expire.</text><text x="22" y="659.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#6fbf92" xml:space="preserve">       → Move the value into the server's `env` block referencing a shell variable, or into a</text><text x="22" y="678.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       credential helper, then rotate it.</text><text x="22" y="716.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="600" fill="#ff8b8b" xml:space="preserve"> CRIT  Invisible characters in always-on text of 'poisoned'</text><text x="22" y="735.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       1 zero-width, bidi-override or Unicode-tag character(s) in content that is injected into the</text><text x="22" y="754.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       system prompt. These render as nothing to you and as text to the model — the standard way to</text><text x="22" y="773.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       hide an instruction from the person reviewing the file.</text><text x="22" y="792.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#6fbf92" xml:space="preserve">       → Open the file with invisible characters shown and delete them. If you did not put them</text><text x="22" y="811.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       there, treat the source as compromised.</text><text x="22" y="849.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="600" fill="#ff8b8b" xml:space="preserve"> CRIT  Plaintext credential in MCP config: Authorization on server 'leaky'</text><text x="22" y="868.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       Looks like a Anthropic API key. It sits in</text><text x="22" y="887.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       ~/contextlint/benchmarks/fixtures/bloated/.mcp.json, which is</text><text x="22" y="906.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       a file that routinely gets committed, synced and shared in screenshots.</text><text x="22" y="925.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#6fbf92" xml:space="preserve">       → Replace the value with ${Authorization} and export the real one from your shell or a secret</text><text x="22" y="944.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       manager. Then rotate it — assume it is burned.</text><text x="22" y="982.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="600" fill="#ff8b8b" xml:space="preserve"> HIGH  'alpha' is byte-identical in 2 locations  -17 tok</text><text x="22" y="1001.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       Identical content: ~/contextlint/benchmarks/fixtures/bloated/.</text><text x="22" y="1020.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       agents/skills/alpha/SKILL.md, ~/contextlint/benchmarks/fixture</text><text x="22" y="1039.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       s/bloated/.claude/skills/alpha/SKILL.md. Each copy contributes its own catalog entry, and the</text><text x="22" y="1058.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       copies will drift apart the first time one is edited.</text><text x="22" y="1077.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#6fbf92" xml:space="preserve">       → Keep ~/contextlint/benchmarks/fixtures/bloated/.agents/skill</text><text x="22" y="1096.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">       s/alpha/SKILL.md and delete the other 1 copy, or replace them with a symlink.</text><text x="22" y="1134.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">  +16 more — use --format json or --html for the full set</text><text x="22" y="1172.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#8a8880" xml:space="preserve">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="22" y="1191.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">Token counts are estimated by contextlint's offline heuristic. Install `contextlint[exact]` and pass</text><text x="22" y="1210.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">--tokenizer tiktoken for measured counts; benchmarks/calibrate.py reports the heuristic's error.</text><text x="22" y="1229.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.4" font-weight="400" fill="#c8c6bc" xml:space="preserve">MCP tool-schema cost is unmeasured and excluded from the totals. Add --mcp-probe to measure it.</text></svg>