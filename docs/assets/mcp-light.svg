<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title id="t">MCP server cost and usage</title><desc id="d">github: 3,517 tokens per turn, called, ok; filesystem: 1,699 tokens per turn, never called, ok; n8n: 0 tokens per turn, never called, fails to start; make: 0 tokens per turn, never called, fails to start; pixelcut: 0 tokens per turn, never called, HTTP 401</desc><rect width="900" height="364" fill="#fcfcfb" rx="10"/><text x="34.0" y="34.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">What each MCP server costs, and whether it is used</text><text x="34.0" y="55.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Tool schemas measured from live tools/list responses, not estimated.</text><text x="34.0" y="104.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">github</text><rect x="142.0" y="92.0" width="506.0" height="18.0" rx="4" fill="#eceae3"/><rect x="142.0" y="92.0" width="506.0" height="18.0" rx="4" fill="#2a78d6"/><text x="658.0" y="105.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">3,517 tok/turn</text><text x="866.0" y="105.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#7d7c75" text-anchor="end">26 tools</text><text x="34.0" y="144.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13" font-weight="500" fill="#52514e" text-anchor="start">filesystem</text><rect x="142.0" y="132.0" width="506.0" height="18.0" rx="4" fill="#eceae3"/><rect x="142.0" y="132.0" width="244.4" height="18.0" rx="4" fill="#ec835a"/><text x="396.4" y="145.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="start">1,699 tok/turn</text><text x="866.0" y="145.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#ec835a" text-anchor="end">14 tools · never called</text><text x="34.0" y="184.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13" font-weight="500" fill="#52514e" text-anchor="start">n8n</text><rect x="142.0" y="172.0" width="506.0" height="18.0" rx="4" fill="#eceae3"/><text x="152.0" y="185.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#7d7c75" text-anchor="start">unmeasurable</text><text x="866.0" y="185.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#ec835a" text-anchor="end">fails to start · never called</text><text x="34.0" y="224.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13" font-weight="500" fill="#52514e" text-anchor="start">make</text><rect x="142.0" y="212.0" width="506.0" height="18.0" rx="4" fill="#eceae3"/><text x="152.0" y="225.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#7d7c75" text-anchor="start">unmeasurable</text><text x="866.0" y="225.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#ec835a" text-anchor="end">fails to start · never called</text><text x="34.0" y="264.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13" font-weight="500" fill="#52514e" text-anchor="start">pixelcut</text><rect x="142.0" y="252.0" width="506.0" height="18.0" rx="4" fill="#eceae3"/><text x="152.0" y="265.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#7d7c75" text-anchor="start">unmeasurable</text><text x="866.0" y="265.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#ec835a" text-anchor="end">HTTP 401 · never called</text><line x1="34" y1="288" x2="866" y2="288" stroke="#e6e4dd" stroke-width="1"/><text x="34.0" y="310.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="550" fill="#52514e" text-anchor="start">1,699 tokens per request, forever, for a server never called in 148 sessions — and three more that do not start.</text></svg>