<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" width="900" height="244" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title id="t">Tokenizer accuracy</title><desc id="d">Aggregate error +1.05% over 541 files. Median per-file absolute error 3.79%, p90 10.0%, worst 21.13%.</desc><rect width="900" height="244" fill="#fcfcfb" rx="10"/><text x="34.0" y="34.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">Offline tokenizer error against tiktoken</text><text x="34.0" y="55.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">541 files · 1,007,941 true tokens · parameters fitted on half the corpus, measured on the other half</text><text x="34.0" y="116.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="44" font-weight="700" fill="#2a78d6" text-anchor="start">+1.05%</text><text x="34.0" y="138.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">aggregate error over the whole corpus</text><text x="34.0" y="158.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#7d7c75" text-anchor="start">— the figure that governs a reported total</text><text x="374.0" y="94.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">median per file</text><rect x="484.0" y="84.0" width="296.0" height="14.0" rx="4" fill="#eceae3"/><rect x="484.0" y="84.0" width="45.0" height="14.0" rx="4" fill="#2a78d6" opacity="0.85"/><text x="866.0" y="96.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">3.79%</text><text x="374.0" y="124.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">p90 per file</text><rect x="484.0" y="114.0" width="296.0" height="14.0" rx="4" fill="#eceae3"/><rect x="484.0" y="114.0" width="118.7" height="14.0" rx="4" fill="#2a78d6" opacity="0.85"/><text x="866.0" y="126.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">10.00%</text><text x="374.0" y="154.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">worst file</text><rect x="484.0" y="144.0" width="296.0" height="14.0" rx="4" fill="#eceae3"/><rect x="484.0" y="144.0" width="250.8" height="14.0" rx="4" fill="#2a78d6" opacity="0.85"/><text x="866.0" y="156.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="end">21.13%</text><text x="374.0" y="186.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#7d7c75" text-anchor="start">absolute error, per individual file</text><line x1="34" y1="200" x2="866" y2="200" stroke="#e6e4dd" stroke-width="1"/><text x="34.0" y="222.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Calibrated on agent configuration — markdown, JSON schemas, YAML frontmatter. Error on other text is unmeasured.</text></svg>