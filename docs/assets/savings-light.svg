<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 284" width="900" height="284" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title id="t">Recoverable tokens, split by confidence</title><desc id="d">Safe to reclaim 1,310 tokens (7%); worth reviewing 16,502 tokens (88%). Reported separately, never summed.</desc><rect width="900" height="284" fill="#fcfcfb" rx="10"/><text x="34.0" y="34.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">What is recoverable, split by whether it is a decision</text><text x="34.0" y="55.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Of 18,703 always-on tokens. These two figures are never summed.</text><text x="34.0" y="96.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Safe to reclaim</text><text x="866.0" y="96.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end">1,310 tok  ·  7%</text><rect x="34.0" y="106.0" width="832.0" height="14.0" rx="4" fill="#eceae3"/><rect x="34.0" y="106.0" width="58.3" height="14.0" rx="4" fill="#0ca30c"/><text x="34.0" y="138.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">byte-identical duplicates and empty assets — removing them cannot change behaviour</text><text x="34.0" y="172.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="start">Worth reviewing</text><text x="866.0" y="172.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="13.5" font-weight="650" fill="#0b0b0b" text-anchor="end">16,502 tok  ·  88%</text><rect x="34.0" y="182.0" width="832.0" height="14.0" rx="4" fill="#eceae3"/><rect x="34.0" y="182.0" width="734.1" height="14.0" rx="4" fill="#ec835a"/><text x="34.0" y="214.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12" font-weight="400" fill="#52514e" text-anchor="start">unused skills, an uncalled server — every one of these is a judgement call</text><line x1="34" y1="228" x2="866" y2="228" stroke="#e6e4dd" stroke-width="1"/><text x="34.0" y="250.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="550" fill="#52514e" text-anchor="start">Adding them would headline “95% reduction available”. It would also be meaningless.</text></svg>