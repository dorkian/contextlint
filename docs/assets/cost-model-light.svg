<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><title id="t">Cost model comparison</title><desc id="d">Pricing agent config by file size reports 290,523 tokens, 145% of a 200,000-token window. Pricing by loading mode reports 18,703 always-on tokens, 9% of the window - a factor of 15.5 difference.</desc><rect width="900" height="250" fill="#fcfcfb" rx="10"/><text x="34.0" y="34.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">The same setup, measured two ways</text><text x="34.0" y="55.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">A skill's body loads only when invoked. Only its one-line catalog entry is always-on.</text><line x1="606.8" y1="76" x2="606.8" y2="196" stroke="#e6e4dd" stroke-width="2" stroke-dasharray="3 3"/><text x="606.8" y="70.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11" font-weight="400" fill="#7d7c75" text-anchor="middle">200k context window</text><text x="34.0" y="88.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="500" fill="#52514e" text-anchor="start">Priced by size on disk</text><text x="866.0" y="88.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#7d7c75" text-anchor="end">what every other auditor reports</text><rect x="34.0" y="96.0" width="832.0" height="30.0" rx="4" fill="#eceae3"/><rect x="34.0" y="96.0" width="832.0" height="30.0" rx="4" fill="#c4c2b8"/><text x="854.0" y="116.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="end">290,523 tokens  ·  145.3% of the window</text><text x="34.0" y="150.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">Priced by loading mode</text><text x="866.0" y="150.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="11.5" font-weight="400" fill="#7d7c75" text-anchor="end">what is actually always-on</text><rect x="34.0" y="158.0" width="832.0" height="30.0" rx="4" fill="#eceae3"/><rect x="34.0" y="158.0" width="53.6" height="30.0" rx="4" fill="#2a78d6"/><text x="99.6" y="178.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">18,703 tokens  ·  9.4% of the window</text><line x1="34" y1="216" x2="866" y2="216" stroke="#e6e4dd" stroke-width="1"/><text x="34.0" y="236.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="12.5" font-weight="550" fill="#52514e" text-anchor="start">Pricing by file size overstates this setup's standing cost by 15.5×.</text></svg>