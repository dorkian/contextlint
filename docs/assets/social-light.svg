<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="contextlint social preview" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'><rect width="1280" height="640" fill="#fcfcfb"/><rect x="0" y="0" width="1280" height="8" fill="#2a78d6"/><g transform="translate(88.00,92.00)"><rect x="0.0" y="0.0" width="76.0" height="76.0" rx="19.0" fill="#2a78d6"/><rect x="15.8" y="17.4" width="44.3" height="9.5" rx="4.75" fill="#ffffff"/><rect x="15.8" y="36.4" width="34.8" height="7.0" rx="3.4833333333333334" fill="#ffffff" opacity="0.62"/><rect x="15.8" y="47.8" width="25.3" height="7.0" rx="3.4833333333333334" fill="#ffffff" opacity="0.49"/><rect x="15.8" y="59.2" width="15.8" height="7.0" rx="3.4833333333333334" fill="#ffffff" opacity="0.36"/></g><text x="190.0" y="150.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="52" font-weight="600" letter-spacing="-0.4" fill="#0b0b0b">context<tspan fill="#2a78d6">lint</tspan></text><text x="192.0" y="196.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Audit what your AI coding assistant loads before you type a word.</text><text x="88.0" y="274.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="17" font-weight="650" fill="#0b0b0b" text-anchor="start">The same setup, measured two ways</text><rect x="88.0" y="308.0" width="1104.0" height="46.0" rx="6" fill="#eceae3"/><rect x="88.0" y="308.0" width="1104.0" height="46.0" rx="6" fill="#c4c2b8"/><text x="1176.0" y="339.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="20" font-weight="650" fill="#0b0b0b" text-anchor="end">290,523 tok · 145.3% of the window</text><text x="88.0" y="376.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="400" fill="#7d7c75" text-anchor="start">priced by size on disk</text><rect x="88.0" y="384.0" width="1104.0" height="46.0" rx="6" fill="#eceae3"/><rect x="88.0" y="384.0" width="71.1" height="46.0" rx="6" fill="#2a78d6"/><text x="175.1" y="415.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="20" font-weight="650" fill="#0b0b0b" text-anchor="start">18,703 tok · 9.4% of the window</text><text x="88.0" y="452.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="400" fill="#7d7c75" text-anchor="start">priced by loading mode</text><text x="88.0" y="488.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="19" font-weight="600" fill="#0b0b0b" text-anchor="start">Pricing by size on disk overstates this setup's standing cost by 15.5×.</text><text x="88.0" y="516.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="15" font-weight="400" fill="#52514e" text-anchor="start">Skill bodies load on demand. Only the one-line catalog entry is always-on.</text><text x="88.0" y="588.0" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' font-size="16" font-weight="400" fill="#52514e" text-anchor="start">+1.05% tokenizer error, measured   ·   0 dependencies   ·   read-only by default</text><text x="1192.0" y="588.0" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace' font-size="16" font-weight="400" fill="#7d7c75" text-anchor="end">github.com/dorkian/contextlint</text></svg>