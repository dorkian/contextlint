[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dorkian-context-lint"
version = "0.1.1"
description = "Audit what your AI coding assistant loads before you type: token cost, dead weight, and MCP security risk — across Claude Code, Codex, Cursor and Copilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashkan Dorkian" }]
keywords = ["llm", "agents", "claude-code", "mcp", "context-window", "tokens", "security", "cursor", "copilot", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]
api = ["anthropic>=0.40"]
dev = ["pytest>=8", "tiktoken>=0.7"]

[project.scripts]
contextlint = "contextlint.cli:main"

[project.urls]
Homepage = "https://github.com/dorkian/contextlint"
Issues = "https://github.com/dorkian/contextlint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/contextlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
