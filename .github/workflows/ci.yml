name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  benchmarks:
    name: benchmarks reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Detection and savings
        # exits non-zero if any planted defect goes undetected
        run: python benchmarks/run.py
      - name: Tokenizer calibration
        run: python benchmarks/calibrate.py

  assets:
    name: generated assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regenerate charts and brand assets
        run: |
          pip install -e .
          python benchmarks/run.py
          python docs/assets/make_charts.py
          python docs/assets/make_brand.py
      - name: Fail if a committed chart no longer matches its data
        run: |
          if ! git diff --quiet -- docs/assets; then
            echo "::error::Charts are stale. Run make_charts.py / make_brand.py and commit."
            git diff --stat -- docs/assets
            exit 1
          fi
