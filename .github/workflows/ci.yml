name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  benchmarks:
    name: benchmarks reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Detection and savings
        # exits non-zero if any planted defect goes undetected
        run: python benchmarks/run.py
      - name: Tokenizer calibration
        run: python benchmarks/calibrate.py

  install-claims:
    name: documented install commands are true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The README once said `uvx contextlint` while the package was not on PyPI,
      # so the headline command failed for every reader. A project whose whole claim
      # is "our numbers are reproducible" cannot ship an install line nobody can run.
      - name: A bare PyPI install must not be documented unless PyPI has the package
        run: |
          set -euo pipefail
          claims=$(grep -rnE '(uvx|pipx run) contextlint\b|(pip|pipx|uv tool) install +.?contextlint' \
                    --include='*.md' --include='*.yml' . \
                    | grep -v 'git+' | grep -v '^\./\.github/workflows/ci\.yml:' || true)
          if [ -n "$claims" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' https://pypi.org/pypi/contextlint/json)
            if [ "$code" != "200" ]; then
              echo "::error::These lines promise a PyPI install, but PyPI returned $code for contextlint:"
              echo "$claims"
              exit 1
            fi
          fi
          echo "install commands are consistent with what is published"

      - name: The package installs from a clean checkout
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q .
          /tmp/v/bin/contextlint --version
          /tmp/v/bin/contextlint checks > /dev/null

  assets:
    name: generated assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regenerate charts and brand assets
        run: |
          pip install -e .
          python benchmarks/run.py
          python docs/assets/make_charts.py
          python docs/assets/make_brand.py
      - name: Fail if a committed chart no longer matches its data
        run: |
          if ! git diff --quiet -- docs/assets; then
            echo "::error::Charts are stale. Run make_charts.py / make_brand.py and commit."
            git diff --stat -- docs/assets
            exit 1
          fi
