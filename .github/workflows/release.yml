# Publish to PyPI on a version tag, using Trusted Publishing (OIDC).
#
# No API token is stored in this repository. PyPI verifies the workflow's identity
# directly, which removes the long-lived credential that would otherwise sit in
# repository secrets — the same class of exposure this tool exists to find.
#
# One-time setup on the PyPI side is documented in RELEASING.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # A tag that disagrees with the packaged version publishes something nobody
      # can reproduce from the tag. Fail before that reaches PyPI, not after.
      - name: Tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != version $pkg"; exit 1; }

      - name: Tests must pass before anything is published
        run: |
          pip install -e ".[dev]"
          python -m pytest tests -q
          python benchmarks/run.py

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      # Distribution name, not the installed command (still `contextlint`) —
      # PyPI's namespace-similarity check rejected the shorter name.
      url: https://pypi.org/p/dorkian-context-lint
    permissions:
      id-token: write        # the OIDC token Trusted Publishing exchanges; no secret needed
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
